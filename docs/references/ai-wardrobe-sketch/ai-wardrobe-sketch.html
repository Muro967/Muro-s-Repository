<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI衣橱 草图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Noto+Serif+SC:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a single phone frame (390pt) on a muted studio wall, with a screen index beside it on wide screens. Single deliberate light Morandi theme. */
:root{
  color-scheme: light;
  --wall:#DCD5CB;      /* backdrop behind the phone */
  --paper:#F2EEE8;     /* app background */
  --card:#FBF9F6;
  --ink:#3E3A36;
  --ink-2:#857D75;
  --line:#E4DDD3;
  --sage:#9CAA97;  --sage-d:#6E7B6A;
  --rose:#C9A8A1;  --rose-l:#EBDCD7;
  --mist:#A4B4BE;  --mist-l:#DCE3E7;
  --clay:#B8977F;  --oat:#E8E0D4;
  --butter:#D9C9A3;
  --serif:"Noto Serif SC","Songti SC",serif;
  --sans:"Noto Sans SC","PingFang SC",system-ui,sans-serif;
  --latin:"Cormorant Garamond","Times New Roman",serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--sans);margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--sage-d);outline-offset:2px;border-radius:8px}

.stage{min-height:100%;display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:32px 16px}
.index{width:260px;flex:none;position:sticky;top:32px}
.index h1{font-family:var(--serif);font-weight:600;font-size:22px;margin:0 0 4px}
.index .sub{color:var(--ink-2);font-size:13px;line-height:1.6;margin:0 0 20px}
.index ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.index li button{width:100%;text-align:left;padding:10px 12px;border-radius:12px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.index li button[aria-current="true"]{background:var(--card)}
.index li span{color:var(--ink-2);font-size:12px}
.note{margin-top:20px;padding:14px;border-radius:14px;background:rgba(251,249,246,.55);font-size:12.5px;line-height:1.7;color:var(--ink-2)}
.note b{color:var(--ink);font-weight:500}
.swatches{display:flex;gap:6px;margin-top:10px}
.swatches i{width:22px;height:22px;border-radius:50%;display:block}

.phone{width:390px;height:844px;flex:none;border-radius:48px;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 0 0 10px #2f2c29,0 30px 60px rgba(60,50,40,.25)}
.statusbar{height:47px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 6px;font-size:14px;font-weight:500;position:relative;z-index:3}
.screen{position:absolute;inset:47px 0 0 0;overflow-y:auto;padding:4px 20px 110px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.sub{padding-bottom:40px}

.tabbar{position:absolute;left:14px;right:14px;bottom:22px;height:64px;border-radius:32px;background:rgba(251,249,246,.92);backdrop-filter:blur(10px);display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 6px 24px rgba(80,70,60,.12);z-index:4}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--ink-2)}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="true"]{color:var(--sage-d);font-weight:500}
.tabbar button[aria-current="true"] .dot{opacity:1}
.tabbar .dot{width:4px;height:4px;border-radius:50%;background:var(--sage-d);opacity:0}

/* shared app components */
.top{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px}
.brand{font-family:var(--latin);font-style:italic;font-size:30px;line-height:1;color:var(--ink)}
.brand em{color:var(--clay);font-style:italic}
.brand small{display:block;font-family:var(--serif);font-style:normal;font-size:13px;letter-spacing:.18em;color:var(--ink-2);margin-top:8px}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--card);font-size:13px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--sage-d);color:#FBF9F6}
.h2{font-family:var(--serif);font-weight:600;font-size:17px;margin:22px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.h2 a,.h2 button{font-family:var(--sans);font-weight:400;font-size:12px;color:var(--ink-2)}
.card{background:var(--card);border-radius:22px;padding:16px}
.muted{color:var(--ink-2)}
.btn{height:46px;border-radius:23px;padding:0 20px;font-weight:500;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--sage-d);color:#FBF9F6}
.btn.ghost{background:var(--oat);color:var(--ink)}
.tag{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--oat);color:var(--ink-2)}
.ai{font-size:10px;padding:2px 6px;border-radius:6px;background:var(--mist-l);color:#5E717C;font-weight:500}
.back{display:flex;align-items:center;gap:6px;margin:8px 0 12px;font-size:14px;color:var(--ink-2)}
.title{font-family:var(--serif);font-weight:600;font-size:22px;margin:0 0 4px}

/* wardrobe */
.ward-switch{display:flex;align-items:center;gap:6px;font-family:var(--serif);font-weight:600;font-size:15px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);margin:14px 0 16px;background:var(--card);border-radius:22px;padding:14px 4px}
.summary div{text-align:center}
.summary b{display:block;font-family:var(--latin);font-style:italic;font-size:28px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.summary span{font-size:11.5px;color:var(--ink-2)}
.summary div+div{border-left:1px solid var(--line)}
.idle-banner{display:flex;align-items:center;gap:12px;background:var(--rose-l);border-radius:20px;padding:12px 14px;margin-top:14px;width:100%;text-align:left}
.idle-banner .ic{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}
.idle-banner p{margin:0;font-size:13.5px;font-weight:500}
.idle-banner small{color:var(--ink-2);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{background:var(--card);border-radius:18px;padding:8px 8px 10px;text-align:left}
.item .ph{aspect-ratio:1;border-radius:12px;display:grid;place-items:center}
.item .ph svg{width:78%;height:78%}
.item p{margin:7px 2px 0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{display:block;margin:2px 2px 0;font-size:10.5px;color:var(--ink-2)}
.fab{position:absolute;right:24px;bottom:100px;width:58px;height:58px;border-radius:50%;background:var(--sage-d);display:grid;place-items:center;box-shadow:0 8px 20px rgba(80,95,75,.35);z-index:4}
.fab svg{width:26px;height:26px}

/* capture */
.cut{background:repeating-conic-gradient(#EFEAE3 0 25%,#F7F4EF 0 50%) 0 0/18px 18px;border-radius:24px;aspect-ratio:1/1;display:grid;place-items:center;position:relative}
.cut svg{width:62%;height:62%;filter:drop-shadow(0 10px 14px rgba(70,60,50,.18))}
.timer{position:absolute;left:12px;top:12px;font-size:12px;background:var(--card);padding:5px 10px;border-radius:999px}
.timer b{color:var(--sage-d)}
.field{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}
.field:last-child{border-bottom:0}
.field .val{display:flex;gap:6px;align-items:center;color:var(--ink-2)}
.cdot{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}

/* idle */
.rate{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rate .card{display:flex;align-items:center;gap:12px}
.rate b{font-family:var(--latin);font-style:italic;font-size:30px;font-weight:600;line-height:1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--oat);border-radius:14px;padding:4px;margin:18px 0 12px}
.seg button{padding:8px 0;border-radius:10px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:500}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:10px;margin-bottom:10px}
.row .ph{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;flex:none}
.row .ph svg{width:80%;height:80%}
.row .meta{flex:1;min-width:0}
.row .meta p{margin:0 0 3px;font-size:14px;font-weight:500}
.row .meta small{font-size:12px;color:var(--ink-2)}
.row .acts{display:flex;flex-direction:column;gap:6px}
.mini{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--oat)}
.mini.rose{background:var(--rose-l)}

/* outfit */
.weather{border-radius:26px;padding:18px;background:linear-gradient(140deg,#C9D3D8 0%,#E6DDD2 100%);display:flex;justify-content:space-between;align-items:center}
.weather .t{font-family:var(--latin);font-style:italic;font-weight:600;font-size:52px;line-height:.9}
.weather p{margin:6px 0 0;font-size:12.5px;color:#5C5650}
.weather .city{font-size:13px;font-weight:500;display:flex;align-items:center;gap:4px}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:2px 20px 4px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.look{flex:none;width:286px;scroll-snap-align:center;background:var(--card);border-radius:26px;padding:14px}
.look .head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-2)}
.look .head b{font-family:var(--latin);font-style:italic;font-size:20px;color:var(--ink);font-weight:600}
.flat{position:relative;height:250px;margin:8px 0 10px;border-radius:18px}
.flat button{position:absolute;display:grid;place-items:center;border-radius:14px}
.flat button:hover{background:rgba(255,255,255,.35)}
.flat svg{width:100%;height:100%;filter:drop-shadow(0 6px 8px rgba(70,60,50,.14))}
.look .why{font-size:12.5px;line-height:1.6;margin:0 0 12px}
.look .acts{display:grid;grid-template-columns:1fr auto;gap:8px}
.swap{position:absolute;left:12px;right:12px;bottom:12px;background:var(--card);border-radius:16px;padding:10px;box-shadow:0 8px 24px rgba(60,50,40,.18);font-size:12px}
.swap .opts{display:flex;gap:8px;margin-top:8px}
.swap .opts span{width:52px;height:52px;border-radius:12px;display:grid;place-items:center}
.swap .opts svg{width:80%;height:80%}
.done{display:flex;gap:12px;align-items:center;background:#E3E8E0;border-radius:20px;padding:14px;margin-top:14px}
.done p{margin:0;font-size:13.5px;font-weight:500}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--sage-d);width:16px;border-radius:3px}

/* inspiration */
.profile{background:var(--card);border-radius:24px;padding:16px}
.bars{display:grid;gap:8px;margin:12px 0}
.bar{display:grid;grid-template-columns:52px 1fr 36px;align-items:center;gap:8px;font-size:12.5px}
.bar i{height:8px;border-radius:4px;display:block}
.bar span:last-child{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.adds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.adds button{background:var(--card);border-radius:16px;padding:12px 0;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:6px}
.adds svg{width:22px;height:22px}
.masonry{columns:2;column-gap:10px}
.insp{break-inside:avoid;margin-bottom:10px;border-radius:20px;overflow:hidden;background:var(--card)}
.insp .art{display:grid;place-items:end center;padding-top:10px}
.insp .art svg{width:70%}
.insp .cap{padding:8px 10px 10px;display:flex;flex-wrap:wrap;gap:4px}

/* me */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats .card{text-align:center;padding:14px 4px}
.stats b{display:block;font-family:var(--latin);font-style:italic;font-weight:600;font-size:30px;line-height:1.1}
.stats span{font-size:12px;color:var(--ink-2)}
.report-card{width:100%;text-align:left;border-radius:24px;padding:16px;background:linear-gradient(150deg,#E9DCD6 0%,#E4E6DD 100%);margin-top:12px;display:block}
.report-card .m{font-family:var(--latin);font-style:italic;font-size:34px;font-weight:600;line-height:1}
.strip{display:flex;gap:6px;margin-top:12px}
.strip span{flex:1;aspect-ratio:3/4;border-radius:10px;background:rgba(251,249,246,.7);display:grid;place-items:end center;overflow:hidden}
.strip svg{width:80%}
.list{background:var(--card);border-radius:22px;padding:2px 16px;margin-top:12px}
.list .field{cursor:default}

/* cabinets + zones */
.cabtabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 14px;padding:0 20px}
.cabtabs::-webkit-scrollbar{display:none}
.cabtab{flex:none;padding:9px 14px;border-radius:16px;background:var(--card);text-align:left;font-size:13.5px;font-weight:500}
.cabtab small{display:block;font-weight:400;font-size:11px;color:var(--ink-2)}
.cabtab[aria-pressed="true"]{background:var(--sage-d);color:#FBF9F6}
.cabtab[aria-pressed="true"] small{color:#DDE3D9}
.cabtab.add{background:transparent;border:1.5px dashed #C9BFB2;color:var(--ink-2)}
.cabinet{background:linear-gradient(160deg,#DCCDB9,#CDBBA4);border-radius:18px;padding:8px;box-shadow:inset 0 0 0 1px rgba(90,70,50,.12),0 10px 24px rgba(90,70,50,.14)}
.cabinet .cells{display:grid;gap:6px;height:300px}
.zone{position:relative;border-radius:10px;background:#F7F2EB;padding:8px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;box-shadow:inset 0 2px 6px rgba(90,70,50,.10)}
.zone b{font-size:12.5px;font-weight:500;position:relative;z-index:1}
.zone small{font-size:11px;color:var(--ink-2);position:relative;z-index:1}
.zone .rod{position:absolute;left:8px;right:8px;top:30px;height:2px;border-radius:1px;background:#BCA58C}
.zone .hang{position:absolute;left:10px;right:10px;top:31px;bottom:24px;display:flex;gap:2px;justify-content:center;align-items:flex-start}
.zone .hang svg{width:34%;height:auto;max-height:100%}
.zone .drawer{position:absolute;left:50%;top:50%;width:26px;height:4px;margin:-2px 0 0 -13px;border-radius:2px;background:#BCA58C}
.zone[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--sage-d)}
.zone .pen{position:absolute;right:6px;top:6px;font-size:11px;color:var(--sage-d);z-index:1}
.addzone{margin-top:10px;width:100%;border:1.5px dashed #C9BFB2;border-radius:14px;padding:10px;color:var(--ink-2);font-size:13px}
.loc{font-size:10.5px;color:var(--sage-d);margin:2px 2px 0;display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:26px 26px 0 0;padding:18px 20px 34px;box-shadow:0 -10px 30px rgba(60,50,40,.18);z-index:6}
.sheet h3{font-family:var(--serif);font-weight:600;font-size:16px;margin:0 0 4px}
.sheet .lbl{font-size:12px;color:var(--ink-2);margin:14px 0 8px}
.scrim{position:absolute;inset:0;background:rgba(62,58,54,.25);z-index:5}
.tools{display:flex;gap:8px}
.icon-btn{position:relative}
.badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--rose);color:#FBF9F6;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
/* search */
.sbox{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:0 14px;height:46px;margin-bottom:6px}
.sbox input{flex:1;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);outline:none;min-width:0}
.sbox svg{width:18px;height:18px;flex:none}
.flabel{font-size:12px;color:var(--ink-2);margin:16px 0 8px}
.cdots{display:flex;gap:10px;flex-wrap:wrap}
.cdots button{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.cdots button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--sage-d)}
.wrapchips{display:flex;gap:8px;flex-wrap:wrap}
/* style library */
.lib{background:var(--card);border-radius:24px;padding:16px;margin-top:12px}
.lib h4{font-size:12px;font-weight:500;color:var(--ink-2);margin:14px 0 8px;display:flex;gap:8px;align-items:baseline}
.lib h4:first-of-type{margin-top:6px}
.lib h4 i{font-style:normal;font-size:11px;color:#A69D93;font-weight:400}
.sty{padding:6px 11px;border-radius:999px;background:var(--paper);font-size:12.5px;color:var(--ink)}
.sty.hit{background:var(--sage-d);color:#FBF9F6}
.sty.hit em{font-style:normal;opacity:.8;margin-left:4px;font-size:11px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.dopt{background:var(--paper);border-radius:14px;padding:10px 12px;text-align:left}
.dopt b{display:block;font-size:13.5px;font-weight:500}
.dopt small{font-size:11px;color:var(--ink-2)}
.dopt[aria-pressed="true"]{background:var(--rose-l);box-shadow:inset 0 0 0 1.5px #B88E86}
.pricebox{display:inline-flex;align-items:center;gap:4px;background:var(--paper);border-radius:12px;padding:0 12px;height:36px;font-size:14px}
.pricebox input{border:0;background:transparent;font:inherit;width:70px;outline:none;color:var(--ink)}
.gtoggle{display:inline-flex;align-items:baseline;gap:6px}
.gtoggle i{font-style:normal;color:#BDB3A8}
.gtoggle button{font-family:var(--serif);font-weight:600;font-size:17px;color:#B3A99E}
.gtoggle button[aria-pressed="true"]{color:var(--ink)}
.lk-tags{display:flex;gap:4px}
.tag.st{background:var(--rose-l);color:#8E6A63}
.accrow{display:flex;align-items:center;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.albl{font-size:11.5px;color:var(--ink-2);margin-right:2px}
.acc{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.acc svg{width:84%;height:84%}
.hairtip{display:flex;gap:10px;align-items:flex-start;background:var(--rose-l);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.hic{width:30px;height:30px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}
.hic svg{width:18px;height:18px}
.hairtip b{display:block;font-size:12.5px;font-weight:500;margin-bottom:2px}
.hairtip small{display:block;font-size:11.5px;color:#7A6660;line-height:1.5}
/* category folders */
.folders{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:14px 20px 4px}
.folders::-webkit-scrollbar{display:none}
.folder{flex:none;width:122px;position:relative;border-radius:4px 18px 18px 18px;padding:10px 10px 12px;text-align:left}
.folder::before{content:"";position:absolute;left:0;top:-10px;width:52px;height:14px;border-radius:9px 12px 0 0;background:inherit}
.folder .fan{height:78px;position:relative;margin:2px 0 10px}
.folder .fan span{position:absolute;bottom:0;width:56px;height:68px;border-radius:10px;background:#FBF9F6;box-shadow:0 3px 10px rgba(60,50,40,.13);display:grid;place-items:center}
.folder .fan span svg{width:86%;height:86%}
.folder .fan span:nth-child(1){left:0;transform:rotate(-9deg)}
.folder .fan span:nth-child(2){left:24px;z-index:2;bottom:4px}
.folder .fan span:nth-child(3){left:48px;transform:rotate(8deg)}
.folder b{display:block;font-family:var(--serif);font-weight:600;font-size:14px}
.folder small{font-size:11.5px;color:var(--ink-2)}
.folder[aria-pressed="true"]{box-shadow:0 0 0 2px var(--sage-d)}
.folder.new{background:transparent;border:1.5px dashed #C9BFB2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-2);font-size:12.5px;min-height:132px}
.folder.new::before{display:none}
/* outfit history */
.seg.two{grid-template-columns:repeat(2,1fr);margin:0 0 12px}
.hist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.oc{background:var(--card);border-radius:20px;padding:8px 8px 10px}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:4px;border-radius:14px;padding:6px;aspect-ratio:1}
.quad span{display:grid;place-items:center}
.quad svg{width:96%;height:96%}
.oc p{margin:8px 4px 2px;font-size:13px;font-weight:500;display:flex;justify-content:space-between}
.oc small{margin:0 4px;font-size:11.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.month{font-family:var(--latin);font-style:italic;font-size:22px;font-weight:600;margin:18px 0 10px}
.heart[aria-pressed="true"]{background:var(--rose-l);color:#9A6B63}
/* report */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal span{aspect-ratio:3/4;border-radius:8px;background:var(--oat);display:grid;place-items:end center;overflow:hidden;font-size:9px;color:var(--ink-2);position:relative}
.cal span em{position:absolute;left:4px;top:3px;font-style:normal}
.cal span svg{width:86%}
.cal .wk{aspect-ratio:auto;background:none;font-size:10px;place-items:center}
.quote{font-family:var(--serif);font-size:14px;line-height:1.8;margin:0}

@media (max-width:720px){
  .stage{padding:0;display:block}
  .index{display:none}
  .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}
}
@media (prefers-reduced-motion:no-preference){
  .screen{animation:fade .25s ease}
  @keyframes fade{from{opacity:.4}to{opacity:1}}
}

  if(b.dataset.swap){const [k,j]=b.dataset.swap.split('-').map(Number);S.swap=(S.swap&&S.swap[0]===k&&S.swap[1]===j)?null:[k,j];S.look=k;return render()}
  if(b.dataset.act==='wear'){S.confirmed=true;S.swap=null;S.hseg='worn';render();document.querySelector('.done')?.scrollIntoView({block:'center'});return}
  if(b.dataset.save){const n=b.dataset.save;S.saved.has(n)?S.saved.delete(n):S.saved.add(n);return render()}
  if(b.dataset.hseg){S.hseg=b.dataset.hseg;return render()}
  if(b.dataset.q){S.q=b.dataset.q==='白'?'白':b.dataset.q;return render()}
  if(b.dataset.sc){S.sc=S.sc===b.dataset.sc?'':b.dataset.sc;return render()}
  if(b.dataset.scol){S.scol=S.scol===b.dataset.scol?'':b.dataset.scol;return render()}
  if(b.dataset.dispose!==undefined){S.dispose=[S.seg,+b.dataset.dispose];S.dmethod=null;S.price='';S.who='';return render()}
  if(b.dataset.watch!==undefined){const it=idle.all.splice(+b.dataset.watch,1)[0];it.d='观察剩余 30 天';it.note='观察期内穿一次即移出';idle.watch.unshift(it);return render()}
  if(b.dataset.dm){S.dmethod=b.dataset.dm;return render()}
  if(b.dataset.plat){S.plat=b.dataset.plat;return render()}
  if(b.dataset.act==='closedispose'){S.dispose=null;return render()}
  if(b.dataset.act==='dodispose'){const [sg,k]=S.dispose;const it=idle[sg].splice(k,1)[0];const m=S.dmethod;const pr=+S.price||0;
    it.m=m;it.price=m==='二手卖出'?pr:0;it.d=m==='二手卖出'?`二手卖出${pr?' ¥'+pr:''} · ${S.plat}`:m==='送给朋友'&&S.who?`送给 ${S.who}`:m;it.note='2026-10-12';
    idle.gone.unshift(it);S.dispose=null;S.seg='gone';return render()}
  if(b.dataset.act==='clearq'){S.q='';S.sc='';S.scol='';S.sst='';return render()}
  if(b.dataset.cab){S.cab=+b.dataset.cab;S.zone=cabs[S.cab].zones[0].id;return render()}
  if(b.dataset.zone){S.zone=b.dataset.zone;return render()}
  if(b.dataset.act==='editcab'){S.editCab=!S.editCab;return render()}
  if(b.dataset.move){S.move=+b.dataset.move;S.mvCab=S.cab;S.mvZone=null;return render()}
  if(b.dataset.mvcab){S.mvCab=+b.dataset.mvcab;S.mvZone=null;return render()}
  if(b.dataset.mvzone){S.mvZone=b.dataset.mvzone;return render()}
  if(b.dataset.act==='closemove'){S.move=null;return render()}
  if(b.dataset.act==='domove'){items[S.move].z=S.mvZone;S.cab=S.mvCab;S.zone=S.mvZone;S.move=null;return render()}
  if(b.dataset.act==='regen'){looks.push(looks.shift());S.swap=null;return render()}
});
render();
</script>
